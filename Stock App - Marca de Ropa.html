<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock - Marca de Ropa</title>
<style>
  :root { --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#111827; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  header h1 { margin:0; font-size:20px; }
  main { padding:24px; max-width:1200px; margin:auto; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .stat .label { color:var(--muted); font-size:13px; }
  .stat .value { font-size:24px; font-weight:700; margin-top:4px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input[type=search] { flex:1; min-width:200px; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.ghost { background:#fff; color:var(--ink); border-color:var(--line); }
  button.small { padding:4px 8px; font-size:13px; }
  button.danger { background:var(--bad); border-color:var(--bad); }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .form-grid label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .b-ok { background:#dcfce7; color:var(--ok); }
  .b-warn { background:#fef3c7; color:var(--warn); }
  .b-bad { background:#fee2e2; color:var(--bad); }
  .qty { display:inline-flex; align-items:center; gap:6px; }
  .qty span { min-width:36px; text-align:center; font-weight:600; }
  .log { max-height:220px; overflow:auto; font-size:13px; }
  .log div { padding:6px 0; border-bottom:1px dashed var(--line); color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:24px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { background:#fff; color:var(--ink); border-color:var(--line); }
  .tabs button.active { background:var(--accent); color:#fff; }
  .hidden { display:none; }
  @media (max-width:700px){ th:nth-child(4), td:nth-child(4){ display:none; } }
</style>
</head>
<body>
<header>
  <h1>👕 Control de Stock</h1>
  <div class="tabs">
    <button id="tabInv" class="active" onclick="showTab('inv')">Inventario</button>
    <button id="tabMov" onclick="showTab('mov')">Movimientos</button>
  </div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="label">Productos (SKU)</div><div class="value" id="sTotal">0</div></div>
    <div class="stat"><div class="label">Unidades en stock</div><div class="value" id="sUnits">0</div></div>
    <div class="stat"><div class="label">Valor del inventario</div><div class="value" id="sValue">$0</div></div>
    <div class="stat"><div class="label">Stock bajo / agotado</div><div class="value" id="sLow">0</div></div>
  </div>

  <section id="viewInv">
    <div class="panel">
      <h2>Agregar producto</h2>
      <div class="form-grid">
        <label>Nombre<input id="fName" placeholder="Ej: Remera básica"></label>
        <label>SKU<input id="fSku" placeholder="REM-001"></label>
        <label>Categoría
          <select id="fCat">
            <option>Remeras</option><option>Pantalones</option><option>Camperas</option>
            <option>Vestidos</option><option>Calzado</option><option>Accesorios</option>
          </select>
        </label>
        <label>Talle
          <select id="fSize"><option>XS</option><option>S</option><option selected>M</option><option>L</option><option>XL</option><option>XXL</option><option>Único</option></select>
        </label>
        <label>Color<input id="fColor" placeholder="Negro"></label>
        <label>Precio ($)<input id="fPrice" type="number" min="0" step="0.01" value="0"></label>
        <label>Cantidad inicial<input id="fQty" type="number" min="0" value="0"></label>
        <label>Stock mínimo<input id="fMin" type="number" min="0" value="5"></label>
      </div>
      <div style="margin-top:12px"><button onclick="addProduct()">Agregar</button></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Buscar por nombre, SKU o color..." oninput="render()">
        <select id="filterCat" onchange="render()"><option value="">Todas las categorías</option>
          <option>Remeras</option><option>Pantalones</option><option>Camperas</option>
          <option>Vestidos</option><option>Calzado</option><option>Accesorios</option>
        </select>
        <select id="filterStock" onchange="render()">
          <option value="">Todo el stock</option><option value="low">Stock bajo</option><option value="out">Agotados</option>
        </select>
        <button class="ghost" onclick="exportCSV()">Exportar CSV</button>
      </div>
      <table>
        <thead><tr><th>Producto</th><th>SKU</th><th>Talle / Color</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="emptyMsg" class="empty hidden">No hay productos que coincidan.</div>
    </div>
  </section>

  <section id="viewMov" class="hidden">
    <div class="panel">
      <h2>Historial de movimientos</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<script>
const KEY = 'stock_ropa_v1';
let products = [];
let movements = [];

function load() {
  const data = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (data) { products = data.products; movements = data.movements; return; }
  products = [
    { id: uid(), name: 'Remera básica', sku: 'REM-001', cat: 'Remeras', size: 'M', color: 'Negro', price: 8500, qty: 24, min: 5 },
    { id: uid(), name: 'Jean recto', sku: 'PAN-010', cat: 'Pantalones', size: '40', color: 'Azul', price: 22000, qty: 3, min: 4 },
    { id: uid(), name: 'Campera rompeviento', sku: 'CAM-004', cat: 'Camperas', size: 'L', color: 'Verde', price: 35000, qty: 0, min: 3 },
    { id: uid(), name: 'Vestido midi', sku: 'VES-007', cat: 'Vestidos', size: 'S', color: 'Beige', price: 19000, qty: 11, min: 3 }
  ];
  movements = [];
  save();
}

function save() { localStorage.setItem(KEY, JSON.stringify({ products, movements })); }
function uid() { return Math.random().toString(36).slice(2, 10); }
function money(n) { return '$' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 2 }); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function logMove(p, delta, note) {
  movements.unshift({ date: new Date().toLocaleString('es-AR'), product: p.name + ' (' + p.sku + ')', delta, note });
  movements = movements.slice(0, 300);
}

function addProduct() {
  const name = v('fName'), sku = v('fSku');
  if (!name || !sku) return alert('Completá al menos nombre y SKU.');
  if (products.some(p => p.sku.toLowerCase() === sku.toLowerCase())) return alert('Ya existe un producto con ese SKU.');
  const p = {
    id: uid(), name, sku, cat: v('fCat'), size: v('fSize'), color: v('fColor') || '-',
    price: parseFloat(v('fPrice')) || 0, qty: parseInt(v('fQty')) || 0, min: parseInt(v('fMin')) || 0
  };
  products.push(p);
  if (p.qty > 0) logMove(p, p.qty, 'Alta de producto');
  ['fName','fSku','fColor'].forEach(id => document.getElementById(id).value = '');
  ['fPrice','fQty'].forEach(id => document.getElementById(id).value = '0');
  save(); render();
}

function v(id) { return document.getElementById(id).value.trim(); }

function adjust(id, delta) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  if (p.qty + delta < 0) return alert('El stock no puede ser negativo.');
  p.qty += delta;
  logMove(p, delta, delta > 0 ? 'Entrada' : 'Salida / venta');
  save(); render();
}

function setMin(id) {
  const p = products.find(x => x.id === id);
  const val = prompt('Nuevo stock mínimo para ' + p.name + ':', p.min);
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n < 0) return alert('Valor inválido.');
  p.min = n; save(); render();
}

function removeProduct(id) {
  const p = products.find(x => x.id === id);
  if (!confirm('¿Eliminar ' + p.name + ' (' + p.sku + ')?')) return;
  products = products.filter(x => x.id !== id);
  save(); render();
}

function status(p) {
  if (p.qty === 0) return ['Agotado', 'b-bad'];
  if (p.qty <= p.min) return ['Stock bajo', 'b-warn'];
  return ['OK', 'b-ok'];
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('filterCat').value;
  const fs = document.getElementById('filterStock').value;

  const list = products.filter(p => {
    const txt = (p.name + ' ' + p.sku + ' ' + p.color).toLowerCase();
    if (q && !txt.includes(q)) return false;
    if (cat && p.cat !== cat) return false;
    if (fs === 'low' && !(p.qty > 0 && p.qty <= p.min)) return false;
    if (fs === 'out' && p.qty !== 0) return false;
    return true;
  }).sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('tbody').innerHTML = list.map(p => {
    const [label, cls] = status(p);
    return `<tr>
      <td><strong>${esc(p.name)}</strong></td>
      <td>${esc(p.sku)}</td>
      <td>${esc(p.size)} / ${esc(p.color)}</td>
      <td>${esc(p.cat)}</td>
      <td>${money(p.price)}</td>
      <td><div class="qty">
        <button class="ghost small" onclick="adjust('${p.id}',-1)">−</button>
        <span>${p.qty}</span>
        <button class="ghost small" onclick="adjust('${p.id}',1)">+</button>
      </div></td>
      <td><span class="badge ${cls}">${label}</span> <small style="color:var(--muted)">mín ${p.min}</small></td>
      <td>
        <button class="ghost small" onclick="setMin('${p.id}')">Mín.</button>
        <button class="danger small" onclick="removeProduct('${p.id}')">✕</button>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('emptyMsg').classList.toggle('hidden', list.length > 0);

  const units = products.reduce((s, p) => s + p.qty, 0);
  const value = products.reduce((s, p) => s + p.qty * p.price, 0);
  const low = products.filter(p => p.qty <= p.min).length;
  document.getElementById('sTotal').textContent = products.length;
  document.getElementById('sUnits').textContent = units;
  document.getElementById('sValue').textContent = money(value);
  document.getElementById('sLow').textContent = low;

  document.getElementById('log').innerHTML = movements.length
    ? movements.map(m => `<div><strong style="color:${m.delta >= 0 ? 'var(--ok)' : 'var(--bad)'}">${m.delta > 0 ? '+' : ''}${m.delta}</strong> · ${esc(m.product)} · ${esc(m.note)} · ${m.date}</div>`).join('')
    : '<div>Sin movimientos todavía.</div>';
}

function showTab(t) {
  document.getElementById('viewInv').classList.toggle('hidden', t !== 'inv');
  document.getElementById('viewMov').classList.toggle('hidden', t !== 'mov');
  document.getElementById('tabInv').classList.toggle('active', t === 'inv');
  document.getElementById('tabMov').classList.toggle('active', t === 'mov');
}

function exportCSV() {
  const rows = [['Nombre','SKU','Categoría','Talle','Color','Precio','Stock','Mínimo']];
  products.forEach(p => rows.push([p.name, p.sku, p.cat, p.size, p.color, p.price, p.qty, p.min]));
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'stock.csv';
  a.click();
}

load();
render();
</script>
</body>
</html>
